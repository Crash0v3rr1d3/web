[build]
  command = "npm run build:ci"
  publish = "dist"

# Same-origin RSS proxies for the /news/ live feed (CORS-free for the client JS).
# Netlify rewrites these to the upstream feeds (status 200 = proxy, not redirect).
# Keep ids in sync with NEWS_SOURCES in src/consts.ts.
[[redirects]]
  from = "/feeds/thn"
  to = "https://feeds.feedburner.com/TheHackersNews"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/bc"
  to = "https://www.bleepingcomputer.com/feed/"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/krebs"
  to = "https://krebsonsecurity.com/feed/"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/record"
  to = "https://therecord.media/feed"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/dr"
  to = "https://www.darkreading.com/rss.xml"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/sw"
  to = "https://www.securityweek.com/feed/"
  status = 200
  force = true

# Security headers. CSP is REPORT-ONLY for now: violations show in the browser
# console without blocking anything. Once a few weeks pass clean, rename the key
# to Content-Security-Policy to enforce it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' https: data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://api.ipify.org; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
