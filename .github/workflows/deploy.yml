name: Build & Deploy

# Deploys the built static site (blog/dist) to the VPS on every push to main.
#
# Infra files (docker-compose.yml, Caddyfile, nginx.conf, anubis-policy.yaml)
# are deliberately NOT shipped by CI: they live outside this public repo so the
# Anubis anti-bot policy and server topology stay private. Deploy those by hand
# when they change, e.g.:
#   rsync -avz nginx.conf <user>@<host>:/opt/crash0v3rr1d3-blog/
#   ssh <user>@<host> 'cd /opt/crash0v3rr1d3-blog && docker compose up -d --force-recreate web'

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  DEPLOY_PATH: "/opt/crash0v3rr1d3-blog"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        working-directory: blog
        run: npm ci

      - name: Sync data & build
        working-directory: blog
        env:
          RANSOMWARE_API_KEY: ${{ secrets.RANSOMWARE_API_KEY }}
        run: npm run build

      # nginx serves blog/dist via a read-only bind mount, so rsyncing the new
      # build is live immediately — no container restart needed for content.
      - name: Deploy site to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: blog/dist/
          remote_path: ${{ env.DEPLOY_PATH }}/blog/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
