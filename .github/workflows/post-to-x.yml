name: Post security news to X

on:
  schedule:
    - cron: '23 */3 * * *' # every 3 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be posted'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pick and post a story
        run: node scripts/post-to-x.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Record what was posted
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/x-posted.json 2>/dev/null || exit 0
          git diff --staged --quiet || (git commit -m "x: record posted story [skip netlify]" && git pull --rebase origin main && git push)
